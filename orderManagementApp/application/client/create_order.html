<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blossom Flora - Create Order</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="logo-container">
            <img src="img/logo.png" alt="Blossom Flora Logo">
        </div>
        <h1>New Floral Order</h1>
        <p class="subtitle">Enter customer details and select fresh flower varieties.</p>

        <form id="orderForm" onsubmit="event.preventDefault(); submitOrder();">
            <!-- Customer Information -->
            <div class="form-group">
                <label for="order_id">Order Identification Code:</label>
                <input type="text" id="order_id" name="order_id" required>
            </div>

            <div class="form-group">
                <label for="customer_name">Customer Full Name:</label>
                <input type="text" id="customer_name" name="customer_name"  required>
            </div>

            <div class="form-group">
                <label for="customer_address">Physical Delivery Address:</label>
                <input type="text" id="customer_address" name="customer_address" required>
            </div>

            <div class="form-group">
                <label for="customer_email">Customer Email Address:</label>
                <input type="email" id="customer_email" name="customer_email" required>
            </div>

            <div class="form-group">
                <label for="customer_phone">Customer Phone Number:</label>
                <input type="text" id="customer_phone" name="customer_phone"  required>
            </div>

            <!-- 4 Floral Products Selection with Checkbox to Enable Quantity -->
            <div class="form-group">
                <label>Select Floral Products & Quantities:</label> <br>

                <div class="product-item">
                    <label>
                        <input type="checkbox" onchange="toggleProduct(this, 'qty_roses')">
                        Roses Bouquet (25.00 €)
                    </label>
                    <input type="number" id="qty_roses" name="quantities[roses]" min="1" value="1" disabled>
                </div>

                <div class="product-item">
                    <label>
                        <input type="checkbox" onchange="toggleProduct(this, 'qty_tulips')">
                        Tulips (15.00 €)
                    </label>
                    <input type="number" id="qty_tulips" name="quantities[tulips]" min="1" value="1" disabled>
                </div>

                <div class="product-item">
                    <label>
                        <input type="checkbox" onchange="toggleProduct(this, 'qty_orchids')">
                        Orchid (30.00 €)
                    </label>
                    <input type="number" id="qty_orchids" name="quantities[orchids]" min="1" value="1" disabled>
                </div>

                <div class="product-item">
                    <label>
                        <input type="checkbox" onchange="toggleProduct(this, 'qty_sunflowers')">
                        Sunflower (20.00 €)
                    </label>
                    <input type="number" id="qty_sunflowers" name="quantities[sunflowers]" min="1" value="1" disabled>
                </div>
            </div>

            <!-- Result Display Area -->
            <div id="result" class="msg-box"></div>

            <!-- Action Buttons -->
            <div class="button-group">
                <button type="button" class="btn btn-primary" onclick="submitOrder()">Submit Flower Order</button>
                <a href="operations_menu.html" class="btn btn-secondary">Back to Operations Menu</a>
                <a href="index.html" class="btn btn-secondary">Back to Home</a>
            </div>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
