<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blossom Flora - Authentication</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="logo-container">
            <img src="img/logo.png" alt="Blossom Flora Logo">
        </div>
        <h1>Commercial Login</h1>
        <p class="subtitle">Please provide your credentials to access the operations menu.</p>

        <form id="loginForm" onsubmit="event.preventDefault(); login();">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Enter username">
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter password">
            </div>

            <div id="result" class="msg-box"></div>

            <div class="button-group">
                <button type="button" class="btn btn-primary" onclick="login()">Access Operations Menu</button>
                <a href="index.html" class="btn btn-secondary">Back to Home</a>
            </div>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
