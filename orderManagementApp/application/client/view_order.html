<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blossom Flora - View Order by ID</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="img/logo.svg" alt="Blossom Flora Logo">
        </div>
        <h1>Search Order by ID</h1>
        <p class="subtitle">Enter the unique order code to view complete order details.</p>

        <form method="GET" action="../server/view_order.php" onsubmit="return validateSearchOrder();">
            <div class="form-group">
                <label for="search_order_id">Order Identification Code:</label>
                <input type="text" id="search_order_id" name="order_id"  required>
            </div>

            <div id="result" class="msg-box"></div>

            <div class="button-group">
                <button type="submit" class="btn btn-primary">Search Order</button>
                <a href="view_menu.html" class="btn btn-secondary">Back to Orders View Menu</a>
                <a href="operations_menu.html" class="btn btn-secondary">Back to Operations Menu</a>
                <a href="index.html" class="btn btn-secondary">Back to Home</a>
            </div>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
